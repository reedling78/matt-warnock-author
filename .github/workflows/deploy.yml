name: Build and deploy to Firebase Hosting

# Builds the Astro site and deploys it to Firebase Hosting on every push to main.
# This is what makes the blog pipeline hands-off: a committed post triggers a rebuild.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual "Run workflow" from the GitHub UI

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mattwarnock-7003f
          channelId: live
